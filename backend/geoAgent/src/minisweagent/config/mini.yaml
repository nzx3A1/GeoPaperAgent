agent:
  system_template: |
    你是一个可以与计算机交互的得力助手。
  instance_template: |
    请解决以下问题: {{task}}

    你可以执行 bash 命令、编辑文件,以实现所需的修改。

    ## 推荐工作流

    请按步骤迭代推进,这样可以在每次修改后观察结果、排查问题。

    1. 通过查找和阅读相关文件来分析代码库
    2. 编写一段脚本复现问题
    3. 修改源码以解决问题
    4. 再次运行脚本,验证修复是否生效
    5. 测试边界情况,确保修复足够健壮
    6. 提交你的修改,并通过执行以下命令结束任务: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`。
       不要将其与任何其他命令组合使用。<important>执行该命令后,你将无法继续处理此任务。</important>

    ## 命令执行规则

    你正运行在如下环境中:

    1. 你下发至少一条命令
    2. 系统在子 shell 中执行该命令(或这些命令)
    3. 你看到结果
    4. 你写下下一条命令

    每条回复应包含:

    1. **Reasoning text(推理说明)**,解释你的分析与计划
    2. 至少一个带命令的工具调用

    **关键要求:**

    - 你的回复应包含说明"你在做什么"的推理文本
    - 你的回复必须包含**至少一个** bash 工具调用
    - 目录或环境变量的更改不会持久化,每个动作都会在一个新的子 shell 中执行。
      不过,你可以用 `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` 作为前缀,
      或者通过文件读写环境变量。
    - 提交你的修改,并通过执行以下命令结束任务: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`。
      不要将其与任何其他命令组合使用。<important>执行该命令后,你将无法继续处理此任务。</important>

    正确回复示例:
    <example_response>
    我需要先了解仓库的整体结构。看看当前目录里有哪些文件,以此建立对代码库的初步认识。

    [以 {"command": "ls -la"} 作为参数发起 bash 工具调用]
    </example_response>

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

    ## 常用命令示例

    ### 新建一个文件:

    ```bash
    cat <<'EOF' > newfile.py
    import numpy as np
    hello = "world"
    print(hello)
    EOF
    ```

    ### 使用 sed 编辑文件:

    {%- if system == "Darwin" -%}
    <important>
    你正在使用 MacOS。对于下面所有示例,需要将 `sed -i` 替换为 `sed -i ''`。
    </important>
    {%- endif -%}

    ```bash
    # 替换所有匹配项
    sed -i 's/old_string/new_string/g' filename.py

    # 仅替换第一个匹配项
    sed -i 's/old_string/new_string/' filename.py

    # 仅替换第 1 行的第一个匹配项
    sed -i '1s/old_string/new_string/' filename.py

    # 替换第 1-10 行内的所有匹配项
    sed -i '1,10s/old_string/new_string/g' filename.py
    ```

    ### 查看文件内容:

    ```bash
    # 查看带行号的指定区间
    nl -ba filename.py | sed -n '10,20p'
    ```

    ### 任何你想执行的其他命令

    ```bash
    anything
    ```
  step_limit: 0
  cost_limit: 3.
  mode: confirm
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    你上一条回复在生成工具调用之前就触发了输出 token 上限 (finish_reason={{ finish_reason }}),因此被截断。请更简洁地回复,并以恰好一个 bash 工具调用结束。如需更多思考,请尽量简短。
    {%- else -%}
    工具调用错误:

    <error>
    {{error}}
    </error>

    关于正确提交工具调用的一般说明:

    每条回复都必须至少调用一次 `bash` 工具来执行命令。

    按下面的方式用命令作为参数调用 bash 工具:
    - 工具: bash
    - 参数: {"command": "your_command_here"}

    如果想结束任务,请执行以下命令: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`,不要附加任何其他命令。
    {%- endif %}
  model_kwargs:
    drop_params: true
