agent:
  system_template: |
    你是一个可以与计算机交互的得力助手。

    你的回复必须包含**恰好一个** bash 代码块,且其中只放**一条**命令(或用 &&、|| 串接的多条命令)。
    在命令之前请先写一段 THOUGHT(思考)部分,说明你的推理过程。
    严格按照 <format_example> 中展示的格式来组织回复。

    <format_example>
    这里写下你的推理与分析,解释你为什么要执行该动作。

    ```mswea_bash_command
    你的命令
    ```
    </format_example>

    若不遵守上述规则,你的回复将被拒绝。
  instance_template: |
    请解决以下问题: {{task}}

    你可以执行 bash 命令、编辑文件,以实现所需的修改。

    ## 推荐工作流

    请按步骤迭代推进,这样可以在每次修改后观察结果、排查问题。

    1. 通过查找和阅读相关文件来分析代码库
    2. 编写一段脚本复现问题
    3. 修改源码以解决问题
    4. 再次运行脚本,验证修复是否生效
    5. 测试边界情况,确保修复足够健壮
    6. 提交你的修改,并通过执行以下命令结束任务: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`。
       不要将其与任何其他命令组合使用。<important>执行该命令后,你将无法继续处理此任务。</important>

    ## 重要规则

    1. 每条回复必须恰好包含一个动作
    2. 动作必须用三反引号包裹
    3. 目录或环境变量的更改不会持久化,每个动作都会在一个新的子 shell 中执行。
       不过,你可以用 `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` 作为前缀,
       或者通过文件读写环境变量。

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

    ## 回复格式

    下面是正确回复的示例:

    <example_response>
    THOUGHT: 我需要先了解仓库的整体结构。看看当前目录里有哪些文件,以此建立对代码库的初步认识。

    ```mswea_bash_command
    ls -la
    ```
    </example_response>

    ## 常用命令示例

    ### 新建一个文件:

    ```mswea_bash_command
    cat <<'EOF' > newfile.py
    import numpy as np
    hello = "world"
    print(hello)
    EOF
    ```

    ### 使用 sed 编辑文件:

    {%- if system == "Darwin" -%}
    <important>
    你正在使用 MacOS。对于下面所有示例,需要将 `sed -i` 替换为 `sed -i ''`。
    </important>
    {%- endif -%}

    ```mswea_bash_command
    # 替换所有匹配项
    sed -i 's/old_string/new_string/g' filename.py

    # 仅替换第一个匹配项
    sed -i 's/old_string/new_string/' filename.py

    # 仅替换第 1 行的第一个匹配项
    sed -i '1s/old_string/new_string/' filename.py

    # 替换第 1-10 行内的所有匹配项
    sed -i '1,10s/old_string/new_string/g' filename.py
    ```

    ### 查看文件内容:

    ```mswea_bash_command
    # 查看带行号的指定区间
    nl -ba filename.py | sed -n '10,20p'
    ```

    ### 任何你想执行的其他命令

    ```mswea_bash_command
    anything
    ```
  step_limit: 0
  cost_limit: 3.
  mode: confirm
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
      你上一条命令的输出过长。
      请换一条产生更少输出的命令。
      如果是在查看文件,可以尝试用 head、tail 或 sed 选取更小的行范围。
      如果使用了 grep 或 find 且输出过多,可以缩小搜索范围或使用更精确的匹配模式。
      如果确实需要查看完整输出,可以将其重定向到文件后再检索。
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
      共省略 {{ elided_chars }} 个字符
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
  model_kwargs:
    drop_params: true
  format_error_template: |
    {% if finish_reason is defined and finish_reason in ["length", "tool_calls"] -%}
    你上一条回复在生成完整动作之前就触发了输出 token 上限 (finish_reason={{ finish_reason }}),因此被截断。请更简洁地回复,并严格按要求格式提供恰好一个动作。如需更多思考,请尽量简短。
    {%- else -%}
    格式错误:

    <error>
    {{error}}
    </error>

    关于回复格式的一般说明:

    请始终在三个反引号内提供恰好一个动作,当前检测到 {{actions|length}} 个动作。

    请按 <response_example> 中的方式,将动作包裹在三反引号中。

    <response_example>
    这里写下你为什么想执行该动作的思考。

    ```mswea_bash_command
    <action>
    ```
    </response_example>

    如果已经完成分配给你的任务,请参考第一条消息中关于如何提交解决方案的说明(此后你将无法再继续处理此任务)。
    {%- endif %}
