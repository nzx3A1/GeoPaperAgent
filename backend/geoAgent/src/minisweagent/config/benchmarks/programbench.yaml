model:
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
      你上一条命令的输出过长。
      请换一条产生更少输出的命令。
      如果是在查看文件,可以尝试用 head、tail 或 sed 选取更小的行范围。
      如果使用了 grep 或 find 且输出过多,可以缩小搜索范围或使用更精确的匹配模式。
      如果确实需要查看完整输出,可以将其重定向到文件后再检索。
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
      共省略 {{ elided_chars }} 个字符
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
    {% if step_limit > 0 and step_limit - n_model_calls < 20 -%}

    <IMPORTANT>
      你所能采取的步骤是有限制的。距离上限还剩 {{ step_limit - n_model_calls }} 步。
      达到上限后,你当前的方案会被自动提交。
      此刻,请停止调试或解决细节问题,把注意力放到整体结果上。请确保:
      1. 你的方案能够编译并产出可执行文件(功能尚不完整也没关系)
      2. 如果还有未完成的步骤,或者你已经意识到的局限,请写入一份 `AGENT_REPORT.md` 文档。重点是交接给下一位 agent —— 清晰地说明遇到的问题以及尚未完成的 TODO。
    </IMPORTANT>
    {%- endif %}
    {% if wall_time_limit_seconds > 0 and wall_time_limit_seconds - elapsed_seconds < 600 -%}

    <IMPORTANT>
      时间不多了。在超时之前,大约还剩 {{ ((wall_time_limit_seconds - elapsed_seconds) / 60) | int }} 分钟。
      请立即收尾:
      1. 确保你的方案能够编译并产出可执行文件(功能尚不完整也没关系)
      2. 如果还有未完成的步骤,或者你已经意识到的局限,请写入一份 `AGENT_REPORT.md` 文档。重点是交接给下一位 agent —— 清晰地说明遇到的问题以及尚未完成的 TODO。
      3. 用 `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` 提交
    </IMPORTANT>
    {%- endif %}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    你上一条回复在生成工具调用之前就触发了输出 token 上限 (finish_reason={{ finish_reason }}),因此被截断。请更简洁地回复,并以恰好一个 bash 工具调用结束。如需更多思考,请尽量简短。
    {%- else -%}
    工具调用错误:

    <error>
    {{error}}
    </error>

    关于正确提交工具调用的一般说明:

    每条回复都必须至少调用一次 `bash` 工具来执行命令。

    按下面的方式用命令作为参数调用 bash 工具:
    - 工具: bash
    - 参数: {"command": "your_command_here"}

    如果已经完成分配给你的任务,请参考第一条消息中关于如何提交解决方案的说明(此后你将无法再继续处理此任务)。
    {%- endif %}
