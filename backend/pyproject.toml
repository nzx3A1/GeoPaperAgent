[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geopaperagent-backend"
version = "0.1.0"
description = "GeoPaperAgent API and agent orchestration service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aiofiles>=24.1.0",
  "asyncpg>=0.30.0",
  "celery[redis]>=5.5.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "minio>=7.2.0,<8.0.0",
  "neo4j>=6.0.0,<7.0.0",
  "paramiko>=3.5.1,<5.0",
  "pydantic>=2.11.0",
  "pydantic-ai-slim[openai]>=2.38.0,<3.0.0",
  "pydantic-settings>=2.10.0",
  "pymilvus==2.4.15",
  "pypdf>=5.0.0,<7.0.0",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.20",
  "redis[hiredis]>=6.2.0",
  "setuptools>=75.0.0,<81.0.0",
  "sse-starlette>=3.0.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["geoAgent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
